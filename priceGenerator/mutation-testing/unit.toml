[cosmic-ray]
module-path = [
    "priceGenerator/price_generator.py",
    "priceGenerator/vendor_catalog.py",
    "priceGenerator/config.py",
    "priceGenerator/orchestrator.py",
    "priceGenerator/main.py",
]
